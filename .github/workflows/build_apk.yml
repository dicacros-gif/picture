name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Publish build log (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ci-log "$GITHUB_WORKSPACE/build.log" --title "CI build log" --notes "latest failing build log" \
          || gh release upload ci-log "$GITHUB_WORKSPACE/build.log" --clobber

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: picture-cleaner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Picture Cleaner (latest)" \
            --notes "스크린샷 크롭/리마스터 + 네이버 블로그 글쓰기 자동화 - 최신 debug APK" \
          || gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
