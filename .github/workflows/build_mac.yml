name: Build Mac M1 App

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: 'adhoc 실행 서명 또는 Apple Developer ID + 공증'
        required: true
        default: adhoc
        type: choice
        options: [adhoc, developer-id]
  push:
    paths:
      - 'mac-app/**'
      - 'windows/blog_*.py'
      - 'windows/naver_automation.py'
      - 'windows/image_delivery.py'
      - '.github/workflows/build_mac.yml'

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mac-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'arm64'
          cache: pip
          cache-dependency-path: mac-app/backend/requirements-mac.txt
      - name: Verify Apple Silicon and install dependencies
        working-directory: mac-app
        run: |
          test "$(uname -m)" = "arm64"
          python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"
          npm ci
          python -m pip install -r backend/requirements-mac.txt
      - name: Test Mac settings, authentication and orchestration
        working-directory: mac-app
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -q
          node --check main.js
          node --check renderer/renderer.js
      - name: Test shared publication and recovery on ARM64
        # These publication/recovery changes are imported directly by the Mac adapter.
        # Exercise them on ARM64 as well as the Mac-specific tests above.
        working-directory: windows
        # test_naver_publish owns Windows process-command parsing and is covered by
        # the Windows suite; the browser-neutral publish panel tests run here.
        run: python -m unittest test_cover_render_recovery test_publish_late_recovery test_published_hashtag_colors test_publish_panel_open test_image_delivery test_blog_visual_style -q
      - name: Bundle shared Blog engine for M1
        working-directory: mac-app
        run: bash scripts/build-backend.sh
      - name: Build Apple Silicon app
        working-directory: mac-app
        run: npm run build:mac
      - name: Sign, verify and run on M1
        working-directory: mac-app
        env:
          SIGNING_MODE: ${{ inputs.signing_mode || 'adhoc' }}
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/sign-and-verify.sh
      - name: Create Mac installation package
        working-directory: mac-app
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_DIR="dist/Blog-M1-$VERSION"
          ZIP_PATH="dist/Blog-M1-$VERSION.zip"
          mkdir -p "$PACKAGE_DIR"
          ditto "dist/mac-arm64/Blog.app" "$PACKAGE_DIR/Blog.app"
          cp Install-Blog.command Install-Picture-Cleaner.command MAC-INSTALL.txt "$PACKAGE_DIR/"
          cp dist/signing-verification.json "$PACKAGE_DIR/"
          chmod 755 "$PACKAGE_DIR/Install-Blog.command" "$PACKAGE_DIR/Install-Picture-Cleaner.command"
          ditto -c -k --sequesterRsrc --keepParent "$PACKAGE_DIR" "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" > "$ZIP_PATH.sha256"
          unzip -l "$ZIP_PATH" | grep -E 'Blog.app/Contents/MacOS/Blog|Install-Blog.command'
      - uses: actions/upload-artifact@v4
        with:
          name: Blog-M1
          path: |
            mac-app/dist/Blog-M1-*.zip
            mac-app/dist/Blog-M1-*.sha256
            mac-app/dist/Blog-M1-ui.png
            mac-app/dist/signing-verification.json
            mac-app/dist/notarization.json
          if-no-files-found: error
